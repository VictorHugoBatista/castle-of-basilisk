# Deploy do Castle of Basilisk para o GitHub Pages.
# Compila o WASM no CI (sempre em sync com o código Rust) e publica a pasta web/.
#
# Requer uma configuracao unica no repo (veja o PR):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Compilar WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Copiar WASM para web/
        run: |
          mkdir -p web/wasm
          cp target/wasm32-unknown-unknown/release/castle_of_basilisk.wasm web/wasm/

      - name: Publicar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
